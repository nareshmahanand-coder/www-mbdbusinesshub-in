<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening Mera Bharat Dukaan</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1a237e;
        color: #ffffff;
        text-align: center;
        padding: 24px;
      }
      a { color: #ffcc33; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening app…</h1>
      <p>If it does not open automatically, <a id="open-app" href="#">tap here</a>.</p>
    </main>
    <script>
      (function () {
        var target = "com.merabharatdukaan.app://auth/callback" + window.location.search + window.location.hash;
        document.getElementById("open-app").setAttribute("href", target);
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
